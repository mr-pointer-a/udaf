# UDAF CI - 8 个 job
# 详细设计见 docs/05-test-plan.md §5.11.3

name: UDAF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 周日 02:00 UTC 跑 fuzz
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # ---------- Job 1: build-debug（含 ASan/UBSan）----------
  build-debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtest-dev libgmock-dev libbenchmark-dev libssl-dev libyaml-cpp-dev libzmq3-dev protobuf-compiler libprotobuf-dev
          # Build fmt v9 header-only first
          curl -sL https://github.com/fmtlib/fmt/archive/refs/tags/9.1.0.tar.gz -o /tmp/fmt.tar.gz
          mkdir -p "$HOME/.local"
          cd /tmp && rm -rf fmt-build fmt-9.1.0 && tar xzf fmt.tar.gz
          cmake -B /tmp/fmt-build -DFMT_TEST=OFF -DFMT_DOC=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DFMT_HEADER_ONLY=ON /tmp/fmt-9.1.0
          cmake --build /tmp/fmt-build -j$(nproc)
          cmake --install /tmp/fmt-build
          # Build spdlog from source (Ubuntu's spdlog links system fmt v8; we need fmt v9)
          curl -sL https://github.com/gabime/spdlog/archive/refs/tags/v1.12.0.tar.gz -o /tmp/spdlog.tar.gz
          cd /tmp && rm -rf spdlog-build spdlog-1.12.0 && tar xzf spdlog.tar.gz
          cmake -B /tmp/spdlog-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DSPDLOG_BUILD_SHARED=OFF -DSPDLOG_FMT_EXTERNAL=ON -DSPDLOG_FMT_HEADER_ONLY=ON /tmp/spdlog-1.12.0
          cmake --build /tmp/spdlog-build -j$(nproc)
          cmake --install /tmp/spdlog-build
      - name: Configure
        run: |
          export CMAKE_PREFIX_PATH="$HOME/.local:/usr":$CMAKE_PREFIX_PATH
          cmake -B build-debug -DCMAKE_BUILD_TYPE=Debug -DUDAF_ENABLE_ASAN=ON -DUDAF_ENABLE_UBSAN=ON -DUDAF_ENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build-debug -j$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-${{ github.sha }}
          path: build-debug/

  # ---------- Job 2: build-release ----------
  build-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtest-dev libbenchmark-dev libssl-dev libyaml-cpp-dev libzmq3-dev protobuf-compiler libprotobuf-dev
          # Build fmt v9 header-only first
          curl -sL https://github.com/fmtlib/fmt/archive/refs/tags/9.1.0.tar.gz -o /tmp/fmt.tar.gz
          mkdir -p "$HOME/.local"
          cd /tmp && rm -rf fmt-build fmt-9.1.0 && tar xzf fmt.tar.gz
          cmake -B /tmp/fmt-build -DFMT_TEST=OFF -DFMT_DOC=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DFMT_HEADER_ONLY=ON /tmp/fmt-9.1.0
          cmake --build /tmp/fmt-build -j$(nproc)
          cmake --install /tmp/fmt-build
          # Build spdlog from source (Ubuntu's spdlog links system fmt v8; we need fmt v9)
          curl -sL https://github.com/gabime/spdlog/archive/refs/tags/v1.12.0.tar.gz -o /tmp/spdlog.tar.gz
          cd /tmp && rm -rf spdlog-build spdlog-1.12.0 && tar xzf spdlog.tar.gz
          cmake -B /tmp/spdlog-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DSPDLOG_BUILD_SHARED=OFF -DSPDLOG_FMT_EXTERNAL=ON -DSPDLOG_FMT_HEADER_ONLY=ON /tmp/spdlog-1.12.0
          cmake --build /tmp/spdlog-build -j$(nproc)
          cmake --install /tmp/spdlog-build
      - name: Configure
        run: |
          export CMAKE_PREFIX_PATH="$HOME/.local:/usr":$CMAKE_PREFIX_PATH
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-release -j$(nproc)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-release-${{ github.sha }}
          path: build-release/

  # ---------- Job 3: static-analysis ----------
  static-analysis:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install static analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy cmake libgtest-dev libgmock-dev libbenchmark-dev libssl-dev libyaml-cpp-dev libzmq3-dev protobuf-compiler libprotobuf-dev
          # Build fmt v9 header-only first
          curl -sL https://github.com/fmtlib/fmt/archive/refs/tags/9.1.0.tar.gz -o /tmp/fmt.tar.gz
          mkdir -p "$HOME/.local"
          cd /tmp && rm -rf fmt-build fmt-9.1.0 && tar xzf fmt.tar.gz
          cmake -B /tmp/fmt-build -DFMT_TEST=OFF -DFMT_DOC=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DFMT_HEADER_ONLY=ON /tmp/fmt-9.1.0
          cmake --build /tmp/fmt-build -j$(nproc)
          cmake --install /tmp/fmt-build
          # Build spdlog from source (Ubuntu's spdlog links system fmt v8; we need fmt v9)
          curl -sL https://github.com/gabime/spdlog/archive/refs/tags/v1.12.0.tar.gz -o /tmp/spdlog.tar.gz
          cd /tmp && rm -rf spdlog-build spdlog-1.12.0 && tar xzf spdlog.tar.gz
          cmake -B /tmp/spdlog-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DSPDLOG_BUILD_SHARED=OFF -DSPDLOG_FMT_EXTERNAL=ON -DSPDLOG_FMT_HEADER_ONLY=ON /tmp/spdlog-1.12.0
          cmake --build /tmp/spdlog-build -j$(nproc)
          cmake --install /tmp/spdlog-build
      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=passedByValue \
            --suppress=knownConditionTrueFalse \
            --suppress=useStlAlgorithm \
            --suppress=virtualCallInConstructor \
            --suppress=unassignedVariable \
            --inline-suppr \
            --quiet --error-exitcode=1 \
            src/
      - name: Configure (for clang-tidy)
        run: |
          # 先配置（不启用 clang-tidy），等 compile_commands.json 产生后再单独运行 clang-tidy
          export CMAKE_PREFIX_PATH="$HOME/.local:/usr":$CMAKE_PREFIX_PATH
          cmake -B build-tidy -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy (debug build)
        run: |
          # 等待 compile_commands.json 生成后再运行 clang-tidy
          # 从 cmake/StaticAnalyzers.cmake 提取 clang-tidy checks（排除正项，只取 -开头的排除项）
          CLANG_TIDY_CHECKS=$(grep -A100 "^set(UDAF_CLANG_TIDY_CHECKS" cmake/StaticAnalyzers.cmake \
            | grep -E "^\s+-" | grep -vE "^\s+-[a-z]+-\*$" \
            | sed 's/^\s*//' | tr '\n' ',' | sed 's/,$//')
          # 用 clang-tidy 扫描全部 src，不启用编译（-fsyntax-only）
          find src -name "*.cpp" -o -name "*.hpp" | \
            xargs clang-tidy -p build-tidy -checks=${CLANG_TIDY_CHECKS} --header-filter='src/.*' 2>&1 | \
            tee clang_tidy.log
          # 如果有 error 级别输出（非 warning），则失败
          if grep -q "error generated" clang_tidy.log; then
            echo "::error::clang-tidy found errors"
            exit 1
          fi

  # ---------- Job 4: test ----------
  test:
    needs: [build-debug]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download debug artifact
        uses: actions/download-artifact@v4
        with:
          name: build-debug-${{ github.sha }}
          path: build-debug
      - name: Run unit + integration tests
        run: ctest --output-on-failure -E "NOT_BUILT|udaf_bench"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: build-debug/Testing/

  # ---------- Job 5: benchmark ----------
  benchmark:
    needs: [build-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: build-release-${{ github.sha }}
          path: build-release
      - name: Run benchmarks (smoke)
        run: ctest -R udaf_bench --output-on-failure
      - name: Full benchmark (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: ./build-release/bench/udaf_bench --benchmark_min_time=1s --benchmark_format=json --benchmark_out=bench_results.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: build-release/bench_results.json
          if-no-files-found: ignore

  # ---------- Job 5b: performance contracts ----------
  perf-contracts:
    needs: [build-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtest-dev libbenchmark-dev libssl-dev libyaml-cpp-dev libzmq3-dev protobuf-compiler libprotobuf-dev
          # Build fmt v9 header-only
          curl -sL https://github.com/fmtlib/fmt/archive/refs/tags/9.1.0.tar.gz -o /tmp/fmt.tar.gz
          mkdir -p "$HOME/.local"
          cd /tmp && rm -rf fmt-build fmt-9.1.0 && tar xzf fmt.tar.gz
          cmake -B /tmp/fmt-build -DFMT_TEST=OFF -DFMT_DOC=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DFMT_HEADER_ONLY=ON /tmp/fmt-9.1.0
          cmake --build /tmp/fmt-build -j$(nproc)
          cmake --install /tmp/fmt-build
          # Build spdlog from source
          curl -sL https://github.com/gabime/spdlog/archive/refs/tags/v1.12.0.tar.gz -o /tmp/spdlog.tar.gz
          cd /tmp && rm -rf spdlog-build spdlog-1.12.0 && tar xzf spdlog.tar.gz
          cmake -B /tmp/spdlog-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DSPDLOG_BUILD_SHARED=OFF -DSPDLOG_FMT_EXTERNAL=ON -DSPDLOG_FMT_HEADER_ONLY=ON /tmp/spdlog-1.12.0
          cmake --build /tmp/spdlog-build -j$(nproc)
          cmake --install /tmp/spdlog-build
      - name: Configure + build bench
        run: |
          export CMAKE_PREFIX_PATH="$HOME/.local:/usr":$CMAKE_PREFIX_PATH
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --target udaf_bench -j$(nproc)
      - name: Run perf contracts (29 timing + 4 memory)
        run: |
          BENCH_DIR="$GITHUB_WORKSPACE/build-release" bash scripts/check_perf_contracts.sh 2>&1 | tee perf_contracts.log
          # 退出码 0/1/2：0=全PASS, 1=SOFT, 2=HARD
          if [ ${PIPESTATUS[0]} -gt 1 ]; then
            echo "::error::Hard perf contract failure"
            exit 1
          fi
      - name: Upload perf contracts log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-contracts-${{ github.sha }}
          path: perf_contracts.log
          if-no-files-found: ignore

  # ---------- Job 6: coverage ----------
  coverage:
    needs: [build-debug]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download debug artifact
        uses: actions/download-artifact@v4
        with:
          name: build-debug-${{ github.sha }}
          path: build-debug
      - name: Install lcov
        run: sudo apt-get install -y lcov
      - name: Run tests to generate .gcda files
        run: |
          # 运行测试（产生 .gcda 文件）
          ctest --output-on-failure -E "NOT_BUILT|udaf_bench"
      - name: Capture coverage
        run: |
          WORKSPACE="$GITHUB_WORKSPACE/build-debug"
          lcov --capture --directory "$WORKSPACE" --output-file "$WORKSPACE/coverage.info" --rc lcov_branch_coverage=1
          lcov --remove "$WORKSPACE/coverage.info" '/usr/*' '*/_deps/*' '*/tests/*' --output-file "$WORKSPACE/coverage.info"
          lcov --list "$WORKSPACE/coverage.info"
      - name: Generate HTML report
        run: genhtml "$GITHUB_WORKSPACE/coverage.info" --output-directory "$GITHUB_WORKSPACE/coverage_html"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: $GITHUB_WORKSPACE/coverage_html/
      - name: Check coverage threshold (90%)
        run: |
          LINES=$(lcov --summary $GITHUB_WORKSPACE/coverage.info 2>&1 | grep "lines" | awk '{print $2}' | tr -d '%')
          echo "Lines coverage: ${LINES}%"
          if (( $(echo "$LINES < 90" | bc -l) )); then
            echo "::error::Coverage dropped below 90% threshold"
            exit 1
          fi

  # ---------- Job 7: fuzz（仅 schedule/manual）----------
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure with fuzz
        run: cmake -B build-fuzz -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DUDAF_ENABLE_FUZZ=ON
      - name: Build fuzzer
        run: cmake --build build-fuzz -j$(nproc) --target udaf_fuzz
      - name: Run fuzz (60s)
        run: |
          cd build-fuzz
          timeout 60 ./fuzz/udaf_fuzz_serializer_decode || echo "fuzz exit=$?"

  # ---------- Job 8: stress（仅 manual/tag 触发）----------
  stress:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtest-dev libssl-dev libyaml-cpp-dev
          # Build fmt v9 header-only first
          curl -sL https://github.com/fmtlib/fmt/archive/refs/tags/9.1.0.tar.gz -o /tmp/fmt.tar.gz
          mkdir -p "$HOME/.local"
          cd /tmp && rm -rf fmt-build fmt-9.1.0 && tar xzf fmt.tar.gz
          cmake -B /tmp/fmt-build -DFMT_TEST=OFF -DFMT_DOC=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DFMT_HEADER_ONLY=ON /tmp/fmt-9.1.0
          cmake --build /tmp/fmt-build -j$(nproc)
          cmake --install /tmp/fmt-build
          # Build spdlog from source (Ubuntu's spdlog links system fmt v8; we need fmt v9)
          curl -sL https://github.com/gabime/spdlog/archive/refs/tags/v1.12.0.tar.gz -o /tmp/spdlog.tar.gz
          cd /tmp && rm -rf spdlog-build spdlog-1.12.0 && tar xzf spdlog.tar.gz
          cmake -B /tmp/spdlog-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -DSPDLOG_BUILD_SHARED=OFF -DSPDLOG_FMT_EXTERNAL=ON -DSPDLOG_FMT_HEADER_ONLY=ON /tmp/spdlog-1.12.0
          cmake --build /tmp/spdlog-build -j$(nproc)
          cmake --install /tmp/spdlog-build
      - name: Configure (stress mode)
        run: |
          export CMAKE_PREFIX_PATH="$HOME/.local:/usr":$CMAKE_PREFIX_PATH
          cmake -B build-stress -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUDAF_ENABLE_STRESS=ON
      - name: Build
        run: cmake --build build-stress -j$(nproc)
      - name: Run stress tests (5 min)
        run: |
          cd build-stress
          timeout 300 ctest -R stress --output-on-failure || echo "stress exit=$?"
